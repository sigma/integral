[package]
name = "integral-device-service"
description = "The Device service: one process owning the INTEGRA-7 link and its DeviceState"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "integral-device-service"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Request heads, to tell a page's GET from a WebSocket upgrade: the parser
# tungstenite itself uses.
httparse = "1"
integral-core = { path = "../integral-core", features = ["serde"] }
integral-web-assets = { path = "../integral-web-assets" }
midir = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

# Sockets: SO_NOSIGPIPE and send(2) flags, which std does not expose.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# The lock-free ring a real-time thread writes through (nih-plug uses it too).
rtrb = "0.3"

[features]
# FakeLink and SequentialSessionIds, for tests of this crate and its clients.
test-util = []

[dev-dependencies]
integral-device-service = { path = ".", features = ["test-util"] }
