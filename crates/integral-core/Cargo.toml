[package]
name = "integral-core"
description = "Integra-7 SysEx engine, state management, and address maps"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
serde = ["dep:serde"]
# Step sequencer for the web UI. Off by default so it never ships in the VST.
sequencer = ["dep:midly"]

[dependencies]
midly = { version = "0.5", default-features = false, features = ["std"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
