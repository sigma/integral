name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    env:
      # Incremental state only bloats the cache; CI never rebuilds in place.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # The Nix cache holds the toolchain, not cargo's build output. flake.lock pins
      # the toolchain, so it keys the cache together with Cargo.lock.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format check (Rust + Nix)
        run: nix develop -c just fmt-check

      - name: Pack WASM
        run: nix develop -c just pack-wasm

      - name: Install web dependencies
        run: nix develop -c bash -c "cd web && npm ci"

      # Before every step that compiles integral-vst, so it embeds the UI.
      - name: Build the plugin's web UI and check it
        run: nix develop -c just build-web-plugin

      - name: Clippy
        run: nix develop -c just lint

      - name: Build (native)
        run: nix develop -c just build

      - name: Test
        run: nix develop -c just test

      - name: CSS lint
        run: nix develop -c just lint-css

      - name: TypeScript check
        run: nix develop -c just lint-web

      - name: Web tests
        run: nix develop -c bash -c "cd web && npx vitest run"

      - name: Build web and check PWA output
        run: nix develop -c just check-pwa

      # Saved from main only, so PR caches don't evict it.
      - name: Save cargo cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
