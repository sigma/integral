name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Incremental state only bloats the cache; CI never rebuilds in place.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (fmt, clippy, build, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the Nix cache step purge superseded entries on main.
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v23

      # One /nix snapshot of the dev shell, shared by both jobs. Only main saves
      # it (and purges the one it supersedes); pull requests restore it read-only,
      # so they never upload. No prefix fallback: a flake.lock bump starts from an
      # empty store, so a new snapshot never carries the old toolchain.
      - name: Restore Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          save: ${{ github.ref == 'refs/heads/main' }}
          # Backstop: never save a store bigger than this (NAR bytes).
          gc-max-store-size-linux: 6G
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # The Nix cache holds the toolchain, not cargo's build output. flake.lock pins
      # the toolchain, so it keys the cache together with Cargo.lock.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-rust-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-keys: cargo-rust-${{ runner.os }}-

      - name: Format check (Rust + Nix)
        run: nix develop -c just fmt-check

      # Before every step that compiles integral-vst, so it embeds the UI. Also
      # packs the WASM and installs the web dependencies it needs.
      - name: Build the plugin's web UI and check it
        run: nix develop -c just build-web-plugin

      - name: Clippy
        run: nix develop -c just lint

      - name: Build (native)
        run: nix develop -c just build

      - name: Test
        run: nix develop -c just test

      # Saved from main only, so PR caches don't evict it.
      - name: Save cargo cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  web:
    name: Web (types, CSS, tests, builds)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v23

      # Same dev shell, same key as the Rust job: see there.
      - name: Restore Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 6G
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # Only the wasm32 build of integral-wasm lives here, so it gets its own key.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-web-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-keys: cargo-web-${{ runner.os }}-

      - name: Pack WASM
        run: nix develop -c just pack-wasm

      - name: Install web dependencies
        run: nix develop -c bash -c "cd web && npm ci"

      - name: CSS lint
        run: nix develop -c just lint-css

      - name: TypeScript check
        run: nix develop -c just lint-web

      - name: Web tests
        run: nix develop -c bash -c "cd web && npx vitest run"

      - name: Build web and check PWA output
        run: nix develop -c just check-pwa

      - name: Save cargo cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
